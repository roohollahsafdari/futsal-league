name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o futsal-league.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: futsal-league
        run: npm install

      - name: Add Android platform
        working-directory: futsal-league
        run: npx cap add android

      - name: Sync web files
        working-directory: futsal-league
        run: npx cap sync android

      - name: Build debug APK
        working-directory: futsal-league/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: futsal-league-apk
          path: futsal-league/android/app/build/outputs/apk/debug/app-debug.apk
